name: One-shot Tuya BLE 0.12.1 migration

on:
  push:
    branches:
      - upgrade/tuya-ble-0.12.1-locks

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: upgrade/tuya-ble-0.12.1-locks
          fetch-depth: 0

      - name: Checkout upstream 0.12.1
        uses: actions/checkout@v7
        with:
          repository: ha-tuya-ble/ha_tuya_ble
          ref: 0.12.1
          path: upstream

      - name: Replace integration with upstream and apply CFM lock adaptations
        shell: bash
        run: |
          set -euo pipefail

          cp custom_components/tuya_ble/brand/icon.png /tmp/tuya_ble_icon.png
          rm -rf custom_components/tuya_ble
          cp -a upstream/custom_components/tuya_ble custom_components/tuya_ble
          rm -rf custom_components/tuya_ble/.vscode
          mkdir -p custom_components/tuya_ble/brand
          cp /tmp/tuya_ble_icon.png custom_components/tuya_ble/brand/icon.png

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path("custom_components/tuya_ble")

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path} but found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Keep fork metadata while using upstream 0.12.1 code and dependencies.
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["codeowners"] = ["@carferrer"]
          manifest["documentation"] = "https://github.com/carferrer/tuya-ble-cfm"
          manifest["issue_tracker"] = "https://github.com/carferrer/tuya-ble-cfm/issues"
          manifest["version"] = "0.12.1-cfm.1"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          # Native 0.12.1 on-demand BLE: lock categories default to disconnected idle
          # unless the user explicitly enables keep_connection in the entry options.
          init_path = root / "__init__.py"
          replace_once(
              init_path,
              "DISCONNECT_TIMEOUT = 15\n\n\nasync def async_setup_entry",
              "DISCONNECT_TIMEOUT = 15\n\n\ndef _default_keep_connection(entry: ConfigEntry) -> bool:\n"
              "    \"\"\"Default battery-powered locks to native on-demand BLE.\"\"\"\n"
              "    return entry.options.get(CONF_CATEGORY) not in {\"ms\", \"jtmspro\"}\n\n\n"
              "async def async_setup_entry",
          )
          replace_once(
              init_path,
              "keep_connection=entry.options.get(\n            CONF_KEEP_CONNECTION, DEFAULT_KEEP_CONNECTION\n        ),",
              "keep_connection=entry.options.get(\n            CONF_KEEP_CONNECTION, _default_keep_connection(entry)\n        ),",
          )
          replace_once(
              init_path,
              "entry.options.get(CONF_KEEP_CONNECTION, DEFAULT_KEEP_CONNECTION)\n        != data.device.keep_connection",
              "entry.options.get(CONF_KEEP_CONNECTION, _default_keep_connection(entry))\n        != data.device.keep_connection",
          )

          config_flow_path = root / "config_flow.py"
          replace_once(
              config_flow_path,
              "default=defaults.get(CONF_KEEP_CONNECTION, DEFAULT_KEEP_CONNECTION),",
              "default=defaults.get(\n"
              "                    CONF_KEEP_CONNECTION,\n"
              "                    False\n"
              "                    if defaults.get(CONF_CATEGORY) in {\"ms\", \"jtmspro\"}\n"
              "                    else DEFAULT_KEEP_CONNECTION,\n"
              "                ),",
          )

          # Register the two CFM jtmspro locks. We intentionally do not set lock=1:
          # their proven control path is DP6 via a button, matching the previous fork.
          devices_path = root / "devices.py"
          replace_once(
              devices_path,
              '    "jtmspro": TuyaBLECategoryInfo(\n        products={\n            **dict.fromkeys(',
              '    "jtmspro": TuyaBLECategoryInfo(\n        products={\n'
              '            **dict.fromkeys(\n'
              '                ["8gza4o8a", "b3aouluh"],\n'
              '                TuyaBLEProductInfo(name="Smart Lock"),\n'
              '            ),\n'
              '            **dict.fromkeys(',
          )

          button_path = root / "button.py"
          replace_once(
              button_path,
              '    "jtmspro": TuyaBLECategoryButtonMapping(\n        products={\n            "hc7n0urm": [',
              '    "jtmspro": TuyaBLECategoryButtonMapping(\n        products={\n'
              '            **dict.fromkeys(\n'
              '                ["8gza4o8a", "b3aouluh"],\n'
              '                [\n'
              '                    TuyaBLEButtonMapping(\n'
              '                        dp_id=6,\n'
              '                        description=ButtonEntityDescription(\n'
              '                            key="bluetooth_unlock",\n'
              '                            icon="mdi:lock-open-variant-outline",\n'
              '                        ),\n'
              '                    ),\n'
              '                ],\n'
              '            ),\n'
              '            "hc7n0urm": [',
          )

          select_path = root / "select.py"
          replace_once(
              select_path,
              '    "jtmspro": TuyaBLECategorySelectMapping(\n        products={\n            "hc7n0urm": [',
              '    "jtmspro": TuyaBLECategorySelectMapping(\n        products={\n'
              '            **dict.fromkeys(\n'
              '                ["8gza4o8a", "b3aouluh"],\n'
              '                [\n'
              '                    TuyaBLESelectMapping(\n'
              '                        dp_id=31,\n'
              '                        description=SelectEntityDescription(\n'
              '                            key="beep_volume",\n'
              '                            options=["mute", "low", "normal", "high"],\n'
              '                            entity_category=EntityCategory.CONFIG,\n'
              '                        ),\n'
              '                    ),\n'
              '                ],\n'
              '            ),\n'
              '            "hc7n0urm": [',
          )

          binary_path = root / "binary_sensor.py"
          replace_once(
              binary_path,
              '    "jtmspro": TuyaBLECategoryBinarySensorMapping(\n        products={\n            **dict.fromkeys(\n                [\n                    "stugc8dl",',
              '    "jtmspro": TuyaBLECategoryBinarySensorMapping(\n        products={\n'
              '            **dict.fromkeys(\n'
              '                ["8gza4o8a", "b3aouluh"],\n'
              '                [\n'
              '                    TuyaBLEBinarySensorMapping(\n'
              '                        dp_id=47,\n'
              '                        description=BinarySensorEntityDescription(\n'
              '                            key="lock_motor_state",\n'
              '                        ),\n'
              '                    ),\n'
              '                ],\n'
              '            ),\n'
              '            **dict.fromkeys(\n'
              '                [\n'
              '                    "stugc8dl",',
          )

          sensor_path = root / "sensor.py"
          replace_once(
              sensor_path,
              '    "jtmspro": TuyaBLECategorySensorMapping(\n        products={\n            "2hmqh0ty": [',
              '    "jtmspro": TuyaBLECategorySensorMapping(\n        products={\n'
              '            **dict.fromkeys(\n'
              '                ["8gza4o8a", "b3aouluh"],\n'
              '                [\n'
              '                    TuyaBLEAlarmLockStateMapping(dp_id=21),\n'
              '                    TuyaBLESensorMapping(\n'
              '                        dp_id=9,\n'
              '                        description=SensorEntityDescription(\n'
              '                            key="battery_state",\n'
              '                            device_class=SensorDeviceClass.ENUM,\n'
              '                            entity_category=EntityCategory.DIAGNOSTIC,\n'
              '                            options=["high", "medium", "low"],\n'
              '                        ),\n'
              '                    ),\n'
              '                ],\n'
              '            ),\n'
              '            "2hmqh0ty": [',
          )
          PY

          # The workflow is only a migration helper and must not remain in the PR.
          rm -f .github/workflows/migrate-tuya-ble-0.12.1.yml
          rm -rf upstream

      - name: Commit migrated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade Tuya BLE to 0.12.1 with lock adaptations"
          git push origin HEAD:upgrade/tuya-ble-0.12.1-locks
