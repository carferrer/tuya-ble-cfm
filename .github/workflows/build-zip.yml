name: Build ZIP for HACS

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create ZIP
        run: |
          cd custom_components/tuya_ble
          zip -r ../../tuya_ble.zip .

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          files: tuya_ble.zip
